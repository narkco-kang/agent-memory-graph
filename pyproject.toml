[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-graph"
version = "0.36.0"
description = "Append-only, evidence-gated semantic memory graph for multi-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "narkco-kang"}]
dependencies = []

[project.scripts]
amg = "amg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

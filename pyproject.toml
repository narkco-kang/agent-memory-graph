[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-graph"
version = "0.4.0"
description = "Append-only, evidence-gated semantic memory graph for multi-agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "narkco-kang"}]
dependencies = []

[project.scripts]
amg = "amg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

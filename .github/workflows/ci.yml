name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e .
      - name: unit tests (ResourceWarning is an error)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: doc/code symbol gate (README + every docs/*.md)
        run: python tools/check_doc_symbols.py
      - name: documentation size budget (README ≤ 12 KiB, docs ≤ 24 KiB)
        run: python tools/check_doc_sizes.py
      - name: end-to-end examples
        run: |
          bash examples/quickstart.sh
          bash examples/lifecycle.sh
          python examples/mcp_client.py
          bash examples/handoff.sh
          bash examples/archive.sh

  package:
    # The artifact is a claim too. v0.7.0's first sdist shipped tests that could
    # not run (docs/, tools/ and experiments/ were missing), and an install-only
    # check would not have caught it because the wheel was fine.
    #
    # Matrix over the minimum supported Python and Windows: the `test` jobs install
    # editable, so until this job was matrixed the *wheel* had never been installed
    # on Python 3.10 or on Windows at all.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: build sdist and wheel
        shell: bash
        run: |
          python -m pip install --quiet build
          python -m build --outdir dist .
      - name: artifact contents
        shell: bash
        run: python tools/check_dist.py dist
      - name: install the built wheel and exercise the console script
        shell: bash
        run: |
          python -m pip install --quiet --force-reinstall --no-deps dist/*.whl
          python - <<'EOF'
          import shutil, subprocess
          import amg

          assert "site-packages" in amg.__file__, f"imported from {amg.__file__}"
          exe = shutil.which("amg")
          assert exe, "console script `amg` is not on PATH after installing the wheel"
          out = subprocess.run([exe, "version"], capture_output=True, text=True, check=True)
          print("imported", amg.__version__, "from", amg.__file__)
          print("console script:", out.stdout.strip())
          assert amg.__version__ in out.stdout, out.stdout
          EOF
      - name: run the test suite shipped inside the sdist
        shell: bash
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          mkdir -p /tmp/sdist
          tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/agent_memory_graph-*
          PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests

name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e .
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: doc/code symbol gate
        run: python tools/check_doc_symbols.py README.md docs/API.md
      - name: end-to-end example
        run: bash examples/quickstart.sh
